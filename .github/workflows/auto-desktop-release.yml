name: Auto Desktop Release

on:
  workflow_run:
    workflows: [Desktop E2E]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  tag-and-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Ensure the tested commit is still the master head
        id: current
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          master_sha="$(git rev-parse origin/master)"
          if [ "$TESTED_SHA" = "$master_sha" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale E2E result for $TESTED_SHA; master is $master_sha."
          fi

      - name: Resolve and validate release version
        if: steps.current.outputs.is_current == 'true'
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          npm run release:validate -- --tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether the release tag already exists
        if: steps.current.outputs.is_current == 'true'
        id: existing
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: >-
          steps.current.outputs.is_current == 'true' &&
          steps.existing.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Start signed desktop release
        if: >-
          steps.current.outputs.is_current == 'true' &&
          steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh workflow run desktop-signed-release.yml
          --ref master
          --field tag="$RELEASE_TAG"
